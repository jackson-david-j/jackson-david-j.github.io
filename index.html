ales and customer experience.", "method": "Defined seven business questions; cleaned and checked data in Python; analysed patterns in SQL; built a Power BI data model and 14 DAX measures; and checked dashboard results against SQL analysis.", "findings": [{"number": "R$13.22M", "label": "Delivered product sales in the dataset"}, {"number": "96,478", "label": "Delivered orders analysed"}, {"number": "6.77%", "label": "Late delivery rate"}], "insights": ["São Paulo, Rio de Janeiro and Minas Gerais represented about 63.38% of delivered product sales.", "Only 3.00% of customers with delivered orders placed more than one delivered order within the observation period.", "Late orders averaged a 2.27 review score, compared with 4.29 for non-late orders. This association does not establish causation."], "recommendations": ["Investigate seller dispatch times, carriers and regional delivery patterns to understand delays.", "Study second-order behaviour in defined time windows and investigate categories with repeat-purchase potential.", "Investigate Office Furniture reviews for potential issues with packaging, assembly, seller service and delivery."], "limitations": "Independent portfolio project using the historical Olist public dataset, mainly 2016–2018. Sales exclude freight. Cost and margin data are unavailable, so profitability cannot be determined. Repeat behaviour is limited to the observation period. No implemented business impact or paid client engagement is claimed.", "images": [{"label": "Executive Overview", "src": "data:image/webp;base64,UklGRkT7AABXRUJQVlA4IDj7AABwBQSdASpABpQDPlEokUajoqQhIlJ5IIAKCWdu/C1zdqDfNhP3Gd42n/JPzEddpiqAaxzvAHPfUH+H/h/mF5X8k/SP235u/2X37+ZfH/37+G/Z3xv/6fC/3z/p+X90B/1/79+avzu/33+//xf+W+Ff9V/03+8/zH76fQJ+qv+i/un97/av45/2G95H7sf7f9h///8gv5j/ff+R/gP3c+XH/x/un7yP7d/zP2z/yXyA/2b/S//f/me+J6sH7xf//3EP21/9vrr/+3/Sfv/9M/9b/3f/r/1374fQl/Qf7x/5fz7/6f0Af+X1AP/16gH//9m/qz/cf7f+x3v27+/v39v/zH+b/wPpr+MfNP2n+5/5X/W/3n9qPjQ/n/7x40/Rf5z/e/5X/Cexf8e+xn4j+zf4z/e/ function home(){document.title=C.name+' — '+C.title;document.getElementById('main').innerHTML=`<div class="wrap"><div class="hero" id="home"><div><div class="eyebrow reveal">${esc(C.title)} / ${esc(C.location)}</div><h1>${C.headline.map((x,i)=>`<span class="reveal ${i===2?'accent':''}">${esc(x)}</span>`).join('')}</h1><p class="intro reveal">I’m ${esc(C.name)}. ${esc(C.intro)}</p><p class="muted">MBA in Marketing · ${esc(C.availability)}</p><div class="actions"><a class="button" href="#work">Explore my work ↗</a><a href="#contact">Get in touch</a></div></div><div class="portrait reveal"><div class="portrait-motion"><img src="${pic(C.portrait)}" alt="AI-styled portrait of ${esc(C.name)} in a navy shirt at a laptop" width="1024" height="1536" fetchpriority="high"></div></div></div><div class="tools">SQL / PYTHON / POWER BI / DAX</div><section id="work"><div class="sectionhead inview"><div><div class="eyebrow">01 / SELECTED WORK</div><h2>Evidence through projects.</h2></div><span class="muted">${C.projects.length} ${C.projects.length===1?'case study':'case studies'}</span></div>${C.projects.map((p,i)=>`<div class="project inview"><div><span class="tag">${esc(p.status)}</span><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><p class="muted">${esc(p.tools)}</p><a href="#project/${encodeURIComponent(p.id)}">View case study ↗</a></div>${p.images?.length?`<a class="projectvisual" href="#project/${encodeURIComponent(p.id)}" aria-label="View ${esc(p.title)} case study"><img src="${pic(p.images[0].src)}" loading="lazy" width="2048" height="1173" alt="${esc(p.images[0].label)} dashboard preview"></a>`:''}</div>`).join('')}</section><section id="skills"><div class="eyebrow">02 / SKILLS</div><h2>Skills</h2><div class="skills">${C.skills.map((s,i)=>`<div class="skill inview"><small>0${i+1}</small><h3>${esc(s.name)}</h3>${s.description?`<p>${esc(s.description)}</p>`:''}<p class="muted">${esc(s.tools)}</p></div>`).join('')}</div></section><section id="about"><div class="aboutgrid inview"><div><div class="eyebrow">03 / ABOUT</div><h2>Business understanding.<br>Analytical thinking.</h2><p class="large">${esc(C.about)}</p><p class="languages"><span>Languages:</span> ${esc(C.languages||'English, Tamil — Professional proficiency')}</p></div><div><h3>Education</h3>${C.education.map(x=>`<div class="education"><strong>${esc(x.degree)}</strong><p>${esc(x.school)}</p><p class="muted">${esc(x.years)}</p></div>`).join('')}</div></div></section><section class="contact" id="contact"><div class="eyebrow">04 / CONTACT</div><div class="contactgrid inview"><div><h2>Let’s connect.</h2><p class="muted">Have a project in mind or want to discuss opportunities? I’d love to hear from you.</p></div><div class="contactlinks"><div class="emailgroup"><a class="emailcard" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=${encodeURIComponent(C.email)}" target="_blank" rel="noopener noreferrer" aria-label="Email ${esc(C.name)} using Gmail"><span class="emailicon" aria-hidden="true">✉</span><span><strong>Email</strong><span class="emailaddress">${esc(C.email)}</span></span></a><button id="copy-email" type="button">Copy email</button><span id="copy-email-status" role="status" aria-live="polite"></span></div>${ext(C.linkedin,'LinkedIn')}${ext(C.github,'GitHub')}</div></div></section></div>`;applyPortfolioDesign();const copyButton=document.getElementById('copy-email');copyButton.onclick=async()=>{let copied=false;try{await navigator.clipboard.writeText(C.email);copied=true}catch(e){const input=document.createElement('textarea');input.value=C.email;input.setAttribute('readonly','');input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();try{copied=document.execCommand('copy')}catch(e){}input.remove();copyButton.focus()}document.getElementById('copy-email-status').textContent=copied?'Email copied.':'Select the email address above and copy it.'};observe();const hero=document.querySelector('.hero');hero.onpointermove=e=>{if(paused||matchMedia('(prefers-reduced-motion:reduce)').matches||e.pointerType!=='mouse')return;const r=hero.getBoundingClientRect();hero.style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*9+'px');hero.style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*7+'px')};hero.onpointerleave=()=>{hero.style.setProperty('--px','0px');hero.style.setProperty('--py','0px')}}
function casePage(p){document.title=p.title+' — '+C.name;document.getElementById('main').innerHTML=`<article><a href="#work">← Back to projects</a><p class="eyebrow">${esc(p.status)}</p><h1>${esc(p.title)}</h1><p class="large">${esc(p.summary)}</p><p class="muted">${esc(p.tools)}</p><div class="actions">${ext(p.github,'Explore code & documentation')}</div><div class="metrics">${p.findings.map(f=>`<div><strong>${esc(f.number)}</strong><span>${esc(f.label)}</span></div>`).join('')}</div><div class="casepart"><h2>The business question</h2><p>${esc(p.problem)}</p><h2>The approach</h2><p>${esc(p.method)}</p></div><h2>Explore the dashboards</h2><p class="muted">Static report screenshots. Select a preview to enlarge it; slicers are interactive in the original Power BI file.</p>${p.images.map((im,i)=>`<figure class="gallery"><button data-image="${i}" aria-label="Enlarge ${esc(im.label)}"><img src="${pic(im.src)}" alt="${esc(im.label)}" loading="lazy"></button><figcaption>${esc(im.label)}</figcaption></figure>`).join('')}<div class="casepart"><h2>What the data suggests</h2><ul>${p.insights.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><h2>Recommended next steps</h2><ol>${p.recommendations.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h2>Scope & limitations</h2><p>${esc(p.limitations)}</p></div><a class="button" href="#contact">Discuss an opportunity ↗</a></article>`;applyPortfolioDesign();document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{const im=p.images[Number(b.dataset.image)],d=document.getElementById('zoom');d.querySelector('img').src=im.src;d.querySelector('img').alt=im.label;d.showModal()});scrollTo(0,0)}document.getElementById('closezoom').onclick=()=>document.getElementById('zoom').close();document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.target.close()};let entranceObserver;function observe(){if(entranceObserver)entranceObserver.disconnect();const targets=document.querySelectorAll('.inview, .reveal');if(!('IntersectionObserver'in window)){targets.forEach(x=>x.classList.add('seen'));return}targets.forEach(x=>{if(x.classList.contains('reveal'))x.classList.add('motion-observed')});entranceObserver=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('seen');else if(e.intersectionRatio===0)e.target.classList.remove('seen')}),{threshold:[0,.08]});targets.forEach(e=>entranceObserver.observe(e))}let mode='';function route(){const h=location.hash.slice(1);if(h.startsWith('project/')){let id;try{id=decodeURIComponent(h.slice(8))}catch(e){id=''}const p=C.projects.find(p=>p.id===id);if(p){mode='case';casePage(p);return}}if(mode!=='home'){home();mode='home'}if(h&&!h.startsWith('project/'))requestAnimationFrame(()=>document.getElementById(h)?.scrollIntoView());else if(h==='home')scrollTo(0,0)}addEventListener('visibilitychange',()=>document.body.classList.toggle('page-hidden',document.hidden));addEventListener('hashchange',route);route();addEventListener('storage',e=>{if(draftMode&&e.key==='jackson-portfolio-draft')location.reload()});
</script></body></html>
